<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cartonero · 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --carton-oscuro: #8b6b4a;
            --dorado: #f4c430;
            --blanco-hueso: #f5eedc;
            --negro-suave: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #3a2a1f;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Fondo completo con cartones.png */
        .fondo-cartones {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('cartones.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        /* Filtro de papel sutil */
        .filtro-papel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background:
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(200, 180, 140, 0.04) 2px,
                    rgba(200, 180, 140, 0.04) 4px),
                radial-gradient(circle at 30% 20%, rgba(139, 107, 74, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(139, 107, 74, 0.08) 0%, transparent 35%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
            background-size: auto, auto, auto, 200px;
        }

        /* Contenedor principal */
        .app {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Barra de navegación superior */
        .navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            margin-bottom: 60px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-link {
            color: var(--blanco-hueso);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 8px 18px;
            border-radius: 20px;
            transition: all 0.25s;
            position: relative;
            cursor: pointer;
        }

        .nav-link:hover {
            background: var(--dorado);
            color: #1a1a1a;
            box-shadow: 0 0 16px rgba(244, 196, 48, 0.5);
        }

        .nav-link.activo {
            background: var(--blanco-hueso);
            color: #1a1a1a;
            font-weight: 700;
        }

        /* Contenido central */
        .contenido-central {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 30px;
        }

        /* Título principal */
        .titulo-container {
            position: relative;
        }

        .titulo-principal {
            font-family: 'Permanent Marker', cursive;
            font-size: 7rem;
            color: var(--dorado);
            text-shadow:
                4px 4px 0 rgba(0, 0, 0, 0.7),
                8px 8px 0 rgba(0, 0, 0, 0.4),
                0 0 40px rgba(244, 196, 48, 0.4),
                0 0 80px rgba(244, 196, 48, 0.2);
            letter-spacing: 6px;
            line-height: 1;
            margin: 0;
            animation: brilloSuave 4s ease-in-out infinite alternate;
        }

        @keyframes brilloSuave {
            0% {
                text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.7), 8px 8px 0 rgba(0, 0, 0, 0.4), 0 0 40px rgba(244, 196, 48, 0.4), 0 0 80px rgba(244, 196, 48, 0.2);
            }
            100% {
                text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.7), 8px 8px 0 rgba(0, 0, 0, 0.4), 0 0 60px rgba(244, 196, 48, 0.6), 0 0 100px rgba(244, 196, 48, 0.35);
            }
        }

        .año {
            display: block;
            font-family: 'Permanent Marker', cursive;
            font-size: 2.5rem;
            color: var(--blanco-hueso);
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
            letter-spacing: 8px;
            margin-top: -5px;
        }

        /* Subtítulo Escribart */
        .subtitulo-escribart {
            font-family: 'Permanent Marker', cursive;
            font-size: 2rem;
            color: var(--blanco-hueso);
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
            letter-spacing: 3px;
            opacity: 0.9;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 30px;
            border-radius: 12px;
            border: 2px solid rgba(244, 196, 48, 0.3);
            backdrop-filter: blur(4px);
        }

        .subtitulo-escribart span {
            color: var(--dorado);
        }

        /* Botón de acceso principal */
        .btn-acceso {
            display: inline-block;
            background: var(--dorado);
            color: #1a1a1a;
            font-family: 'Permanent Marker', cursive;
            font-size: 1.4rem;
            padding: 16px 40px;
            border-radius: 40px;
            text-decoration: none;
            letter-spacing: 3px;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.25s;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-acceso:hover {
            transform: translateY(-4px);
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.6);
            background: #ffe066;
        }

        .btn-acceso:active {
            transform: translateY(0);
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: rgba(245, 238, 220, 0.6);
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer strong {
            color: var(--dorado);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .titulo-principal {
                font-size: 4rem;
                letter-spacing: 3px;
            }
            .año {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }
            .subtitulo-escribart {
                font-size: 1.3rem;
                padding: 8px 20px;
            }
            .navbar {
                gap: 5px;
                padding: 10px;
            }
            .nav-link {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .btn-acceso {
                font-size: 1.1rem;
                padding: 12px 28px;
            }
        }

        @media (max-width: 480px) {
            .titulo-principal {
                font-size: 2.8rem;
            }
            .año {
                font-size: 1.4rem;
            }
            .subtitulo-escribart {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo de cartones -->
    <div class="fondo-cartones"></div>

    <!-- Filtro de papel sutil -->
    <div class="filtro-papel"></div>

    <!-- Aplicación -->
    <div class="app">

        <!-- Barra de navegación -->
        <nav class="navbar">
            <a href="#" class="nav-link activo">Principal</a>
            <a href="./Escribart/index.html" class="nav-link">Escribart</a>
            <a href="./dibujos/index.html" class="nav-link">Dibujos</a>
            <a href="./novelas/index.html" class="nav-link">Novelas</a>
            <a href="https://instagram.com/elcartonero" target="_blank" class="nav-link">Instagram</a>
            <a href="https://youtube.com/@elcartonero" target="_blank" class="nav-link">YouTube</a>
        </nav>

        <!-- Contenido central -->
        <div class="contenido-central">
            <div class="titulo-container">
                <h1 class="titulo-principal">EL CARTONERO</h1>
                <span class="año">2026</span>
            </div>
            <p class="subtitulo-escribart">
                <span>Escribart</span> · Historietas para mi
            </p>
            <a href="./Escribart/index.html" class="btn-acceso">
                📘 Entrar a la colección
            </a>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>📦 <strong>EL CARTONERO</strong> · 2026 · Todos los derechos reservados</p>
            <p style="margin-top: 4px;">Hecho con cartón reciclado y tinta ecológica</p>
        </footer>

    </div>

    <script>
        // Marcar enlace activo según página actual
        const links = document.querySelectorAll('.nav-link');
        const path = window.location.pathname.split('/').pop();

        links.forEach(link => {
            link.classList.remove('activo');
            if (link.getAttribute('href') === '#' && (path === '' || path === 'index.html')) {
                link.classList.add('activo');
            }
        });

        console.log('%c📦 El Cartonero %c| %c2026 %c| %cEscribart · Historietas para mi',
            'font-size:1.4rem;color:#f4c430;', '', 'color:#f5eedc;font-size:1.2rem;', '', 'color:#aaa;');
    </script>
</body>
</html>
